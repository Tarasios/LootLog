# On-demand test builds: Android APK + Windows zip, uploaded as workflow
# artifacts only. Unlike release.yml this does NOT create a GitHub Release and
# skips macOS/Linux. Run it from the Actions tab -> "Test build" -> Run workflow.

name: Test build

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.5' # keep in lockstep with release.yml

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build APK (debug-signed, fine for sideloading)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lootlog-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Windows
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: lootlog-windows
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
