# Build every LootLog artifact and attach them to a GitHub Release, so that
# "sharing the app" is only ever "sharing a release link".
#
# Distribution is GitHub Releases only (see docs/distribution.md). There is no
# store account, no server, and no telemetry: the release download counts ARE
# the metrics (tool/release_downloads.dart).
#
# Triggers:
#   - "Run workflow" from the Actions tab: builds the chosen branch (main by
#     default) at its CURRENT head and publishes a new release tagged
#     `v<pubspec version>-build.<run number>`, marked Latest. Leave the tag
#     input blank for this. (Note: "Re-run jobs" on an old run rebuilds that
#     run's original commit, not the latest code. Start a new run instead.)
#   - Push a tag like `v1.0.0`: builds that tag and publishes its release.
#   - "Run workflow" with a tag input: rebuilds that existing tag.
# Each platform builds on its own native runner (Flutter does not
# cross-compile desktop binaries), uploads its artifact, and a final job
# gathers them into one Release.
#
# Every build gets `--build-number=<run number>`, so the Android versionCode
# always goes up and a new APK installs as an update over the previous one.
#
# The Android job produces a *signed, sideloadable* APK only when the repository
# has the four ANDROID_* signing secrets set; otherwise it falls back to Flutter's
# debug signing (still installable, not fit for public distribution) exactly like
# a local build without android/key.properties. Desktop bundles are unsigned;
# platform code-signing/notarization is documented as an optional local step in
# docs/distribution.md.

name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Leave blank to build the selected branch as a new release. Or an existing tag to rebuild (e.g. v1.0.0).'
        required: false
        default: ''

# Pin the toolchain so tagged builds are reproducible. Keep this in lockstep
# with FLUTTER_VERSION in tool/setup-env.sh and the pin in docs/distribution.md.
env:
  FLUTTER_VERSION: '3.44.5'

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      build_name: ${{ steps.v.outputs.build_name }}
      build_number: ${{ steps.v.outputs.build_number }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      # A tag input pins the build to that tag; otherwise this is the pushed
      # tag or the head of the dispatched branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - id: v
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          base="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml)"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$base-build.$GITHUB_RUN_NUMBER"
          fi
          version="${tag#v}"
          # Store and desktop version fields need a plain x.y.z.
          build_name="${version%%-*}"
          if ! [[ "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            build_name="$base"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build_name=$build_name"
            echo "build_number=$GITHUB_RUN_NUMBER"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building $tag ($build_name+$GITHUB_RUN_NUMBER) from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Configure release signing (only if secrets are present)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/upload.jks
            cat > app/android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Release signing configured."
          else
            echo "::warning::No ANDROID_* signing secrets set — building a debug-signed APK. Set them for a public release."
          fi
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ needs.version.outputs.build_number }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "dist/lootlog-${{ needs.version.outputs.version }}-android.apk"
      - name: Scrub signing material
        if: always()
        run: rm -f app/android/key.properties app/android/upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Windows
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ needs.version.outputs.build_number }}
      - name: Package (zip the Release folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath "dist/lootlog-${{ needs.version.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build macOS
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ needs.version.outputs.build_number }}
      - name: Package (.app zip + .dmg)
        shell: bash
        run: |
          mkdir -p dist
          app_path="app/build/macos/Build/Products/Release/lootlog.app"
          v="${{ needs.version.outputs.version }}"
          ditto -c -k --keepParent "$app_path" "dist/lootlog-$v-macos.app.zip"
          hdiutil create -volname LootLog -srcfolder "$app_path" \
            -ov -format UDZO "dist/lootlog-$v-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Install desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Linux
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ needs.version.outputs.build_number }}
      - name: Package (tarball of the bundle)
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/lootlog-${{ needs.version.outputs.version }}-linux-x64.tar.gz" \
            -C app/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, android, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Stable-name aliases so "releases/latest/download/<name>" is a
      # permanent direct link (tarasios.ca points at these). The versioned
      # files stay the canonical artifacts.
      - name: Add stable-name download aliases
        run: |
          set -euo pipefail
          cp artifacts/android/lootlog-*-android.apk artifacts/lootlog-android.apk
          cp artifacts/windows/lootlog-*-windows-x64.zip artifacts/lootlog-windows-x64.zip
          cp artifacts/linux/lootlog-*-linux-x64.tar.gz artifacts/lootlog-linux-x64.tar.gz
      # A new tag is created at the exact commit that was built; an existing
      # tag keeps pointing where it was.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: LootLog ${{ needs.version.outputs.tag }}
          body: |
            Built from commit ${{ needs.version.outputs.sha }} (app version ${{ needs.version.outputs.build_name }}+${{ needs.version.outputs.build_number }}).
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
